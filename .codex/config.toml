# Web はスクリプトで読む（hosted の web_search には hooks が発火しないので、ツール自体を外す）
web_search = "disabled"

# 調査係の既定。0.153.4 の codex exec では spawn_agent に名前指定が無く .codex/agents/*.toml を名前で呼べないので、
# 既定モデルで安いモデルに寄せる。実装を委譲する用途が出たら外す。
[agents]
default_subagent_model = "gpt-5.4-mini"
default_subagent_reasoning_effort = "low"
